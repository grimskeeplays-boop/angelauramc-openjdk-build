name: Build Java 21.0.8 Android ARM64

on:
  workflow_dispatch:

jobs:
  build_android_arm64:
    name: Build Java 21.0.8 for Android ARM64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up boot JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            autoconf \
            python3 \
            python-is-python3 \
            unzip \
            zip \
            systemtap-sdt-dev \
            libxtst-dev \
            libasound2-dev \
            libelf-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev

      - name: Build Android ARM64 JRE
        run: |
          export TARGET_VERSION=21
          bash 1_ci_build_arch_aarch64.sh

      - name: Upload Android ARM64 JRE
        uses: actions/upload-artifact@v4
        with:
          name: jre21-android-aarch64-21.0.8
          path: jre21-android*.tar.xz
          if-no-files-found: error
          retention-days: 30
