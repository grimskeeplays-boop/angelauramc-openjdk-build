name: Build JDK21THOR 21.0.8+9 Android ARM64

on:
  workflow_dispatch:

jobs:
  build_android_arm64:
    name: Build JDK21THOR 21.0.8+9 for AYN Thor
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up boot JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            autoconf \
            python3 \
            python-is-python3 \
            unzip \
            zip \
            systemtap-sdt-dev \
            libxtst-dev \
            libasound2-dev \
            libelf-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev

      - name: Build JDK21THOR Android ARM64 JRE
        run: |
          export TARGET_VERSION=21
          bash 1_ci_build_arch_aarch64.sh

      - name: Create SHA-256 checksum
        run: sha256sum jre21-android*.tar.xz | tee SHA256SUMS.txt

      - name: Upload JDK21THOR runtime
        uses: actions/upload-artifact@v4
        with:
          name: JDK21THOR-21.0.8-build9-Android-AArch64
          path: |
            jre21-android*.tar.xz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
